# The Scripticus registry bundle (ARCHITECTURE.md): a reverse proxy fronting
# the index service and the Gitea instance that provides storage,
# authentication, and namespace ownership. Clients (and enterprise firewalls)
# see one URL — the proxy (D45) — which routes blob downloads to Gitea and
# everything else to the index. See server/README.md for first-run Gitea setup
# (creating the user/org that owns a namespace and a token to publish with).
#
# The index image is published by the release workflow on server-v* tags.
# To run unreleased local changes instead, build from source:
#   docker build -f server/Dockerfile -t kevinchannon/scripticus-server .
#
# This file is self-contained: the proxy's Caddyfile is an inline config, not
# a bind mount, so `curl`-ing this one file and running `docker compose up -d`
# stands the bundle up with no checkout (D45). Inline config content needs
# Docker Compose v2.23.1 or newer.
services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "8000:80"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - index
      - gitea

  index:
    image: kevinchannon/scripticus-server:latest
    # No host port: the index sits behind the proxy on the internal network.
    expose:
      - "8000"
    environment:
      SCRIPTICUS_GITEA_URL: http://gitea:3000
      SCRIPTICUS_INDEX_DB: sqlite:////data/scripticus-index.db
    volumes:
      - index-data:/data
    depends_on:
      - gitea

  gitea:
    image: gitea/gitea:1.24
    # Kept on the host for first-run web setup (registering users/orgs and
    # minting a publish token); the client never needs this address (D45).
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:3000/
    ports:
      - "3000:3000"
    volumes:
      - gitea-data:/data

volumes:
  index-data:
  gitea-data:

configs:
  # The single user-facing front for the registry bundle (D45). A client
  # points at one URL for everything; this splits the traffic internally:
  #
  #   /api/packages/.../generic/...  -> Gitea (blob download, D9)
  #   everything else                -> the index service
  #
  # Blob downloads pass straight through to Gitea's generic package registry,
  # so the index *application* never touches blob bytes (D9) — the proxy is
  # dumb pass-through infrastructure, not the index app. `resolve` returns
  # download pointers relative to this front URL, so the client fetches
  # `{remote.url}/api/packages/...` with its stored Gitea token, which the
  # proxy forwards untouched. The index<->Gitea internal calls (auth, publish
  # uploads) use the internal address directly and never come through here.
  caddyfile:
    content: |
      :80 {
      	# Gitea's blob path is `/api/packages/...`; the index API lives under
      	# `/packages` (no `/api`), `/resolve`, `/search`, `/whoami`, `/health`,
      	# `/version`, so the two never collide.
      	@gitea path /api/packages/*
      	handle @gitea {
      		reverse_proxy gitea:3000
      	}

      	handle {
      		reverse_proxy index:8000
      	}
      }
