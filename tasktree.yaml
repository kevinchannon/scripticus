# yaml-language-server: $schema=https://raw.githubusercontent.com/kevinchannon/tasktree/main/schema/tasktree-schema.json
#
# Release automation for the scripticus uv workspace (see the "Releasing"
# runbook in CLAUDE.md for the manual equivalent this encodes).
#
#   tt release schema=minor server=minor client=minor
#   tt release common=patch dry_run=yes      # preview, touch nothing
#   tt versions                              # show what's currently released
#
# Each package takes a bump kind: none | patch | minor | major. The release task
# is a pass-through to scripts/release, which does the work and documents it.

runners:
  # The e2e suite runs in a containerised runner over the host Docker daemon
  # (docker-out-of-docker): the socket is mounted in, tests/e2e.sh `compose up`s
  # the registry bundle as sibling containers, and BATS drives the client. The
  # repo (including dist/ from the `build` task) is auto-mounted. See
  # tests/e2e-tests.dockerfile and doc/DECISIONS.md D55.
  #
  # run_as_root here, and only here: the mounted socket is mode 0660 owned by
  # root, with a group that differs by platform (root on Docker Desktop,
  # `docker` with a host-specific GID on Linux CI), so there is no portable
  # `--group-add`. That is the right call rather than a workaround — handing a
  # container the Docker socket is already equivalent to host root, so the
  # container's own uid buys nothing. The `scripts` runner below, which needs
  # no socket, does not get root.
  e2e:
    type: containerised
    engine: docker
    dockerfile: tests/e2e-tests.dockerfile
    run_as_root: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # The shell-script specs need only BATS and a POSIX sh — no daemon socket, no
  # wheels, no stack. Same image as `e2e` deliberately: it is already built and
  # cached, a second toolchain would be one more thing to keep in step, and
  # sharing it keeps /bin/sh identical so the scripts run under the shell the
  # specs were written against. What differs is what is *not* here — no mounted
  # socket, so nothing under this runner can reach the host's Docker.
  #
  # Runs as the host user. `get-scripticus-svr` defaults its admin account to
  # `id -un`, which needs the mapped UID to have a passwd entry — the Dockerfile
  # creates one from these build args (tasktree #215, fixed in 1.4.0). Nothing
  # here needs root, so nothing here gets it.
  scripts:
    type: containerised
    engine: docker
    dockerfile: tests/e2e-tests.dockerfile
    args:
      build: ["--build-arg", "UID={{ tt.uid }}", "--build-arg", "GID={{ tt.gid }}"]

tasks:
  update-uv-deps:
    desc: Sync the workspace virtual environment from the lockfile (uv sync).
    cmd: uv sync

  build:
    desc: Build the workspace wheels into dist/.
    # Content-scoped caching: rebuild the wheels only when the packaged source,
    # a pyproject, or the lockfile changes — not on every unrelated repo edit.
    inputs:
      - common/src/**
      - schema/src/**
      - client/src/**
      - "*/pyproject.toml"
      - uv.lock
    outputs:
      - dist/*.whl
    cmd: |
      set -euo pipefail
      uv build --package scripticus-common --wheel --out-dir dist
      uv build --package scripticus-schema --wheel --out-dir dist
      uv build --package scripticus        --wheel --out-dir dist

  unit-test:
    desc: Run the pytest suite (client, server, schema, common).
    # Deliberately independent of `build`: pytest runs against the editable uv
    # workspace, not the built wheels.
    inputs:
      - common/src/**
      - schema/src/**
      - client/src/**
      - "*/pyproject.toml"
      - uv.lock
    cmd: uv run pytest

  e2e-test:
    desc: >-
      Full-stack end-to-end tests — stand the registry bundle up from source and
      drive the real client through the README's lifecycle with BATS.
    deps: [build]
    runner: e2e
    # Source freshness is inherited via `build`; these add the test harness, so
    # editing a spec or the stand-up plumbing re-runs the suite (an unchanged
    # tree still skips).
    inputs:
      - tests/*.bats
      - tests/lib/**
      - tests/e2e.sh
      - tests/e2e-tests.dockerfile
      - tests/docker-compose.*.yml
      - scripts/start-server
      - server/Dockerfile
      - docker-compose.yml
    cmd: tests/e2e.sh

  script-test:
    desc: >-
      Unit tests for the repo's shell scripts (get-scripticus-svr's preflight,
      refusals, and project-name derivation), with docker and curl stubbed.
      Containerised so BATS need not be installed locally.
    runner: scripts
    inputs:
      - tests/scripts/*.bats
      - tests/e2e-tests.dockerfile
      - get-scripticus-svr
    cmd: bats --print-output-on-failure tests/scripts

  start-server:
    desc: >-
      Stand up a local registry bundle (proxy + index + Gitea) from source, with
      a test user + token, and leave it running to hack the client against.
    cmd: scripts/start-server

  test:
    desc: Run all tests
    deps: [ unit-test, script-test, e2e-test ]
    cmd: echo "All tests complete"

  versions:
    desc: Show the latest released version of each workspace package (from git tags).
    cmd: |
      {% raw %}
      set -euo pipefail
      for c in common schema server client; do
        last="$(git tag --list "${c}-v*" | sed "s/^${c}-v//" \
          | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
        printf '%-8s %s\n' "$c" "${last:-<unreleased>}"
      done
      {% endraw %}

  release:
    desc: >-
      Release one or more workspace packages to PyPI. Pass a bump per package
      (none|patch|minor|major), e.g. 'tt release schema=minor client=patch'.
    args:
      - common: { choices: [none, patch, minor, major], default: none }
      - schema: { choices: [none, patch, minor, major], default: none }
      - server: { choices: [none, patch, minor, major], default: none }
      - client: { choices: [none, patch, minor, major], default: none }
      - dry_run: { type: str, choices: ["no", "yes"], default: "no" }
    cmd: |
      scripts/release \
        common={{ arg.common }} schema={{ arg.schema }} \
        server={{ arg.server }} client={{ arg.client }} \
        dry_run={{ arg.dry_run }}
